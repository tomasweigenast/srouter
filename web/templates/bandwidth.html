{{template "layout.html" .}}
{{define "title"}}Bandwidth — srouter{{end}}

{{define "content"}}
<div class="space-y-6">
  <h1 class="text-xl font-semibold text-gray-900">Bandwidth</h1>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-white border border-gray-200 rounded-xl p-5">
      <p class="text-sm font-medium text-gray-600 mb-4">ppp0 — WAN</p>
      <canvas id="chart-ppp0" height="120"></canvas>
    </div>
    <div class="bg-white border border-gray-200 rounded-xl p-5">
      <p class="text-sm font-medium text-gray-600 mb-4">lan — LAN</p>
      <canvas id="chart-lan" height="120"></canvas>
    </div>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script src="/static/vendor/chart.min.js"></script>
<script>
const MAX_POINTS = 60;

function makeChart(canvasId) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array(MAX_POINTS).fill(''),
      datasets: [
        { label: 'RX (KB/s)', data: Array(MAX_POINTS).fill(null), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4, pointRadius: 0 },
        { label: 'TX (KB/s)', data: Array(MAX_POINTS).fill(null), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.4, pointRadius: 0 },
      ]
    },
    options: {
      animation: false,
      scales: {
        x: { display: false },
        y: { min: 0, ticks: { color: '#6b7280' }, grid: { color: '#e5e7eb' } }
      },
      plugins: { legend: { labels: { color: '#374151', boxWidth: 12 } } }
    }
  });
}

const charts = {
  'ppp0': makeChart('chart-ppp0'),
  'lan':  makeChart('chart-lan'),
};

function pushData(chart, rx, tx) {
  chart.data.datasets[0].data.push(rx / 1024);
  chart.data.datasets[1].data.push(tx / 1024);
  if (chart.data.datasets[0].data.length > MAX_POINTS) {
    chart.data.datasets[0].data.shift();
    chart.data.datasets[1].data.shift();
  }
  chart.update('none');
}

// Use native EventSource — more reliable than HTMX SSE for JSON data streams
const es = new EventSource('/bandwidth/events');
es.addEventListener('bwdata', e => {
  const d = JSON.parse(e.data);
  if (charts[d.Iface]) pushData(charts[d.Iface], d.RxBps, d.TxBps);
});
es.onerror = () => console.warn('bandwidth SSE disconnected, will reconnect');
window.addEventListener('beforeunload', () => es.close());
</script>
{{end}}
