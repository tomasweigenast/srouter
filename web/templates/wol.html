{{template "layout.html" .}}
{{define "title"}}Wake-on-LAN — srouter{{end}}

{{define "content"}}
<div class="space-y-6">
  <h1 class="text-xl font-semibold text-gray-900">Wake-on-LAN</h1>

  <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wider">
          <th class="px-4 py-3 text-left">Name</th>
          <th class="px-4 py-3 text-left">MAC Address</th>
          <th class="px-4 py-3 text-left">IP Hint</th>
          <th class="px-4 py-3 text-left w-32"></th>
        </tr>
      </thead>
      <tbody id="wol-devices" class="divide-y divide-gray-100">
        {{range .Devices}}{{template "wol_device_row" .}}{{end}}
      </tbody>
    </table>
  </div>

  <details class="bg-white border border-gray-200 rounded-xl">
    <summary class="px-4 py-3 text-sm text-blue-400 cursor-pointer select-none hover:text-blue-300">+ Add device</summary>
    <form data-ajax="true" action="/wol/devices" method="post"
          data-target="#wol-devices" data-swap="beforeend"
          data-reset="true"
          class="px-4 pb-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div>
        <label class="text-xs text-gray-500 block mb-1">Name</label>
        <input type="text" name="name" placeholder="My PC" required
               class="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="text-xs text-gray-500 block mb-1">MAC Address</label>
        <input type="text" name="mac" placeholder="aa:bb:cc:dd:ee:ff" required
               class="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 mono focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="text-xs text-gray-500 block mb-1">IP Hint (optional)</label>
        <input type="text" name="ip" placeholder="192.168.0.50"
               class="w-full bg-gray-100 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 mono focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="col-span-3 flex justify-end">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg transition-colors">Add Device</button>
      </div>
    </form>
  </details>
</div>
{{end}}
