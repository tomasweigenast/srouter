{{define "wol_device_row"}}
<tr class="hover:bg-gray-100/50 transition-colors">
  <td class="px-4 py-3 text-gray-300 font-medium">{{.Name}}</td>
  <td class="px-4 py-3 mono text-gray-600">{{.MAC}}</td>
  <td class="px-4 py-3 mono text-gray-500">{{if .IP}}{{.IP}}{{else}}<span class="text-gray-700">—</span>{{end}}</td>
  <td class="px-4 py-3 text-right flex items-center gap-2 justify-end">
    <button onclick="fetchToast(this, 'POST', '/wol/send/{{.ID}}')"
            class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-md transition-colors">
      Wake
    </button>
    <button onclick="deleteRowConfirm(this)"
            data-url="/wol/devices/{{.ID}}"
            data-confirm="Delete {{.Name}}?"
            class="text-xs text-red-400 hover:text-red-300 transition-colors">Delete</button>
  </td>
</tr>
{{end}}
