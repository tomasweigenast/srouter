{{define "dns_entries"}}
{{range .}}{{template "dns_entry_row" .}}{{end}}
{{end}}

{{define "dns_entry_row"}}
<tr class="hover:bg-gray-100/50 transition-colors">
  <td class="px-4 py-3 mono text-gray-300">{{.Hostname}}</td>
  <td class="px-4 py-3 mono text-blue-300">{{.IP}}</td>
  <td class="px-4 py-3 text-right">
    <button hx-delete="/dns/entries/{{.Hostname}}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Delete {{.Hostname}}?"
            class="text-xs text-red-400 hover:text-red-300 transition-colors">Delete</button>
  </td>
</tr>
{{end}}
