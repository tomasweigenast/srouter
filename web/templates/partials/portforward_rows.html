{{define "portforward_rows"}}
{{range .}}
<tr class="hover:bg-gray-100/50 transition-colors">
  <td class="px-4 py-3 text-gray-300 font-medium">{{.Name}}</td>
  <td class="px-4 py-3">
    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
                 {{if eq .Protocol "tcp"}}bg-blue-100 text-blue-700{{else}}bg-purple-100 text-purple-700{{end}}">
      {{.Protocol}}
    </span>
  </td>
  <td class="px-4 py-3 mono text-gray-300">{{.ExtPort}}</td>
  <td class="px-4 py-3 mono text-gray-600">{{.IntIP}}:{{.IntPort}}</td>
  <td class="px-4 py-3 text-right">
    <button onclick="deleteRowConfirm(this)"
            data-url="/portforward/{{.Name}}"
            data-confirm="Delete port forward &#39;{{.Name}}&#39;?"
            class="text-xs text-red-400 hover:text-red-300 transition-colors">Delete</button>
  </td>
</tr>
{{end}}
{{end}}
