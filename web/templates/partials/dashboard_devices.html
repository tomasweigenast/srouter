{{define "dashboard_devices"}}
{{if .}}
<div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wider">
        <th class="px-4 py-3 text-left">IP Address</th>
        <th class="px-4 py-3 text-left">MAC Address</th>
        <th class="px-4 py-3 text-left">Hostname</th>
        <th class="px-4 py-3 text-left">Source</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      {{range .}}
      <tr class="hover:bg-gray-100/50 transition-colors">
        <td class="px-4 py-3 mono text-blue-300">{{.IP}}</td>
        <td class="px-4 py-3 mono text-gray-600">{{.MAC}}</td>
        <td class="px-4 py-3 text-gray-300">{{if .Hostname}}{{.Hostname}}{{else}}<span class="text-gray-600">—</span>{{end}}</td>
        <td class="px-4 py-3">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
                       {{if eq .Source "dhcp"}}bg-blue-100 text-blue-700{{else}}bg-gray-100 text-gray-600{{end}}">
            {{.Source}}
          </span>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{else}}
<div class="bg-white border border-gray-200 rounded-xl px-6 py-8 text-center text-gray-600 text-sm">
  No devices detected.
</div>
{{end}}
{{end}}
