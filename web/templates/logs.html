{{template "layout.html" .}}
{{define "title"}}Logs — srouter{{end}}

{{define "content"}}
<div class="space-y-4 h-full flex flex-col">
  <div class="flex items-center gap-3 flex-wrap">
    <h1 class="text-xl font-semibold text-gray-900">Logs</h1>
    <form class="flex gap-2 ml-auto" id="log-filter-form">
      <select name="category" onchange="reconnectSSE()"
              class="bg-gray-100 border border-gray-300 rounded-lg px-3 py-1.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="" {{if eq .Filter.Category ""}}selected{{end}}>All categories</option>
        <option value="firewall" {{if eq .Filter.Category "firewall"}}selected{{end}}>Firewall</option>
        <option value="dhcp"     {{if eq .Filter.Category "dhcp"}}selected{{end}}>DHCP</option>
        <option value="pppoe"    {{if eq .Filter.Category "pppoe"}}selected{{end}}>PPPoE</option>
        <option value="system"   {{if eq .Filter.Category "system"}}selected{{end}}>System</option>
      </select>
      <input type="text" name="search" placeholder="Search…" value="{{.Filter.Search}}"
             oninput="applySearch()"
             class="bg-gray-100 border border-gray-300 rounded-lg px-3 py-1.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 w-48">
    </form>
    <button id="autoscroll-btn" onclick="toggleAutoScroll()"
            class="text-xs text-blue-400 hover:text-blue-300 transition-colors whitespace-nowrap">Auto-scroll: ON</button>
    <button id="wrap-btn" onclick="toggleWrap()"
            class="text-xs text-gray-500 hover:text-gray-900 transition-colors whitespace-nowrap">Wrap: ON</button>
    <button onclick="document.getElementById('log-lines').innerHTML = ''"
            class="text-xs text-gray-500 hover:text-gray-900 transition-colors">Clear</button>
  </div>

  <div class="flex-1 bg-white border border-gray-200 rounded-xl overflow-hidden">
    <div id="log-lines"
         class="log-container h-[70vh] overflow-y-auto p-4 space-y-0.5 mono text-xs whitespace-pre-wrap break-all">
    </div>
  </div>
</div>
{{end}}

{{block "scripts" .}}
<script>
let autoScroll = true;
let wrapLines  = true;
let logsES     = null;

function connectLogsSSE(category) {
  if (logsES) logsES.close();
  const logLines = document.getElementById('log-lines');
  logsES = new EventSource('/logs/events?category=' + encodeURIComponent(category || ''));
  logsES.addEventListener('logline', function(e) {
    logLines.insertAdjacentHTML('beforeend', e.data);
  });
}

function reconnectSSE() {
  const category = document.querySelector('#log-filter-form [name=category]').value;
  document.getElementById('log-lines').innerHTML = '';
  connectLogsSSE(category);
}

function toggleWrap() {
  wrapLines = !wrapLines;
  const el  = document.getElementById('log-lines');
  const btn = document.getElementById('wrap-btn');
  if (wrapLines) {
    el.classList.remove('whitespace-pre', 'overflow-x-auto');
    el.classList.add('whitespace-pre-wrap', 'break-all');
    btn.textContent = 'Wrap: ON';
  } else {
    el.classList.remove('whitespace-pre-wrap', 'break-all');
    el.classList.add('whitespace-pre', 'overflow-x-auto');
    btn.textContent = 'Wrap: OFF';
  }
}

const logLines = document.getElementById('log-lines');

const scrollObserver = new MutationObserver(function(mutations) {
  if (autoScroll) logLines.scrollTop = logLines.scrollHeight;
  const q = document.querySelector('[name=search]').value.toLowerCase();
  if (q) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (node.nodeType === 1 && !node.textContent.toLowerCase().includes(q)) {
          node.style.display = 'none';
        }
      });
    });
  }
});
scrollObserver.observe(logLines, { childList: true });

logLines.addEventListener('scroll', function() {
  const nearBottom = logLines.scrollTop + logLines.clientHeight >= logLines.scrollHeight - 60;
  if (!nearBottom && autoScroll) { autoScroll = false; updateScrollBtn(); }
});

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  updateScrollBtn();
  if (autoScroll) logLines.scrollTop = logLines.scrollHeight;
}

function updateScrollBtn() {
  const btn = document.getElementById('autoscroll-btn');
  if (autoScroll) {
    btn.textContent = 'Auto-scroll: ON';
    btn.classList.replace('text-gray-500', 'text-blue-400');
  } else {
    btn.textContent = 'Auto-scroll: OFF';
    btn.classList.replace('text-blue-400', 'text-gray-500');
  }
}

function applySearch() {
  const q = document.querySelector('[name=search]').value.toLowerCase();
  document.querySelectorAll('#log-lines > *').forEach(function(el) {
    el.style.display = (q === '' || el.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

// Connect on page load with the server-rendered initial category
connectLogsSSE(document.querySelector('#log-filter-form [name=category]').value);
</script>
{{end}}
