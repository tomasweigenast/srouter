<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>srouter — Login</title>
  <link rel="stylesheet" href="/static/vendor/tailwind.css">
</head>
<body class="h-full bg-gray-50 flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-900">srouter</h1>
      <p class="text-gray-500 text-sm mt-1">Router Dashboard</p>
    </div>

    <form method="POST" action="/login"
          class="bg-white border border-gray-200 rounded-xl px-8 py-8 space-y-5">
      {{if .Error}}
      <div class="bg-red-50 border border-red-300 text-red-700 text-sm px-4 py-3 rounded-lg">
        {{.Error}}
      </div>
      {{end}}

      <div class="space-y-1">
        <label class="text-xs font-medium text-gray-600 uppercase tracking-wider">Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus
               class="w-full bg-gray-100 border border-gray-300 rounded-lg px-4 py-2.5 text-sm
                      text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2
                      focus:ring-blue-500 focus:border-transparent">
      </div>

      <div class="space-y-1">
        <label class="text-xs font-medium text-gray-600 uppercase tracking-wider">Password</label>
        <input type="password" name="password" autocomplete="current-password" required
               class="w-full bg-gray-100 border border-gray-300 rounded-lg px-4 py-2.5 text-sm
                      text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2
                      focus:ring-blue-500 focus:border-transparent">
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5
                     rounded-lg text-sm transition-colors">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
