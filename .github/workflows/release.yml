name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install APT build deps
        run: sudo apt-get install -y gcc libpam0g-dev

      - name: Install frontend deps
        run: bun install

      - name: Build frontend assets
        run: |
          mkdir -p web/static/vendor
          bunx tailwindcss -i web/static/input.css -o web/static/vendor/tailwind.css --minify
          cp node_modules/chart.js/dist/chart.umd.min.js       web/static/vendor/chart.min.js
          cp node_modules/codemirror/lib/codemirror.js          web/static/vendor/codemirror.js
          cp node_modules/codemirror/lib/codemirror.css         web/static/vendor/codemirror.css
          cp node_modules/codemirror/mode/shell/shell.js        web/static/vendor/codemirror-shell.js
          cp node_modules/codemirror/theme/monokai.css          web/static/vendor/codemirror-monokai.css

      - name: Build binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION="${{ github.ref_name }}"
          go build \
            -ldflags "-X github.com/tomasweigenast/srouter/internal/system.AppVersion=${VERSION}" \
            -o bin/srouter-linux \
            ./cmd

      - name: Package release archive
        run: |
          tar -czf bin/srouter-linux.tar.gz \
            -C bin srouter-linux \
            -C "${{ github.workspace }}/scripts" install.sh

      - name: Build release notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"

          # Commits since the previous tag (or all commits if this is the first tag).
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" \
              --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log --oneline --no-merges \
              --pretty=format:"- %s (%h)")
          fi

          # Optional: pull matching section from CHANGELOG.md.
          # Expects a heading like "## v1.2.3" or "## [v1.2.3]".
          CHANGELOG=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk \
              "/^## \[?${TAG}\]?/{found=1; next} found && /^## /{exit} found{print}" \
              CHANGELOG.md | sed '/^[[:space:]]*$/d')
          fi

          # Compose body: changelog section first (if any), then commit list.
          BODY=""
          if [ -n "$CHANGELOG" ]; then
            BODY="${CHANGELOG}"$'\n\n'
          fi
          if [ -n "$COMMITS" ]; then
            BODY="${BODY}### Commits"$'\n'"${COMMITS}"
          fi

          # Write to a file to avoid quoting issues with multiline strings.
          printf '%s' "$BODY" > /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: |
            bin/srouter-linux
            bin/srouter-linux.tar.gz
